apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-data-simulator
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-data-simulator
  template:
    metadata:
      labels:
        app: axion-data-simulator
    spec:
      containers:
        - name: axion-data-simulator
          image: xonacr.azurecr.io/axion-data-simulator:latest
          ports:
            - containerPort: 8001

          env:
            - name: DATABASE_URL
              value: "postgresql://axion_user:P%40ssw01rd%40123@postgresql.axiondb.svc.cluster.local:5432/axion_db"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"